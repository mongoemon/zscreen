<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:" />
  <title>Zcreenshot</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="theme-color" content="#1b1c20" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Splash: covers the toolbar until renderer.js finishes setting up (then fades out and is removed). -->
  <div id="splash" class="splash" aria-hidden="true">
    <div class="splash-mark"><svg viewBox="0 0 24 24"><use href="#i-region"/><circle cx="12" cy="12" r="3"/></svg></div>
    <div class="splash-name">Zcreenshot</div>
    <div class="splash-bar"><span></span></div>
  </div>

  <!-- Icon sprite (24x24 stroke icons). Every button below is icon-only; its title/aria-label come from i18n.js. -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-image-plus" viewBox="0 0 24 24"><path d="M16 5h6"/><path d="M19 2v6"/><path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/><circle cx="9" cy="9" r="2"/></symbol>
    <symbol id="i-stack" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="5" rx="1"/><rect x="5" y="9.5" width="14" height="5" rx="1"/><rect x="5" y="16.5" width="14" height="5" rx="1"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></symbol>
    <symbol id="i-copy-all" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 17H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v1"/><path d="M15.5 12.5v7M12 16h7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65S8.93 17.38 9 18v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
    <symbol id="i-history"viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><rect x="3" y="2" width="12" height="16" rx="2"/><path d="M7 7h4"/><path d="M7 11h4"/><path d="M20 9v11"/><path d="m17 17 3 3 3-3"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></symbol>
    <symbol id="i-stop"viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 15h6"/><path d="M12 18v-6"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-close"viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>

    <symbol id="i-select" viewBox="0 0 24 24"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="m6.5 17.5 11-11"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></symbol>
    <symbol id="i-rect" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></symbol>
    <symbol id="i-ellipse" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="10" ry="7"/></symbol>
    <symbol id="i-highlight" viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></symbol>
    <symbol id="i-step" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m10 9.5 2-1.5v8"/></symbol>
    <symbol id="i-region" viewBox="0 0 24 24"><path d="M5 3a2 2 0 0 0-2 2"/><path d="M19 3a2 2 0 0 1 2 2"/><path d="M21 19a2 2 0 0 1-2 2"/><path d="M5 21a2 2 0 0 1-2-2"/><path d="M9 3h1"/><path d="M9 21h1"/><path d="M14 3h1"/><path d="M14 21h1"/><path d="M3 9v1"/><path d="M21 9v1"/><path d="M3 14v1"/><path d="M21 14v1"/></symbol>
    <symbol id="i-censor" viewBox="0 0 24 24"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></symbol>
  </svg>

  <header class="toolbar">
    <div class="brand">Zcreenshot</div>
    <button id="version-badge" class="version" data-i18n-title="version.title" aria-haspopup="dialog"></button>
    <button id="btn-blank" data-shortcut="newBlank" class="icon-btn" data-i18n-title="btn.blank" aria-haspopup="dialog"><svg class="icon"><use href="#i-file-plus"/></svg></button>
    <button id="btn-paste" class="icon-btn" data-i18n-title="btn.paste"><svg class="icon"><use href="#i-paste"/></svg></button>
    <button id="btn-open" data-shortcut="openFiles" class="icon-btn" data-i18n-title="btn.open"><svg class="icon"><use href="#i-image-plus"/></svg></button>
    <button id="btn-history" data-shortcut="toggleHistory" class="icon-btn" data-i18n-title="btn.history" aria-pressed="false" hidden><svg class="icon"><use href="#i-history"/></svg></button>
    <span class="sep"></span>
    <button id="btn-arrange" data-shortcut="arrange" class="icon-btn" data-i18n-title="btn.arrange"><svg class="icon"><use href="#i-stack"/></svg></button>
    <button id="btn-fit" data-shortcut="fit" class="icon-btn" data-i18n-title="btn.fit"><svg class="icon"><use href="#i-fit"/></svg></button>
    <button id="btn-undo" data-shortcut="undo" class="icon-btn" data-i18n-title="btn.undo"><svg class="icon"><use href="#i-undo"/></svg></button>
    <button id="btn-delete" data-shortcut="deleteSelected" class="icon-btn" data-i18n-title="btn.delete"><svg class="icon"><use href="#i-trash"/></svg></button>
    <button id="btn-clear" data-shortcut="clearAll" class="icon-btn" data-i18n-title="btn.clear"><svg class="icon"><use href="#i-eraser"/></svg></button>
    <span class="spacer"></span>
    <!-- Capture: take something new from the screen, centred in the bar (kept apart from the editing buttons) -->
    <div class="tb-group tb-capture" role="group" data-i18n-aria="group.capture">
      <button id="btn-record" data-shortcut="record" class="icon-btn" data-i18n-title="btn.record" aria-haspopup="dialog"><svg class="icon"><use href="#i-video"/></svg></button>
      <button id="btn-record-audio" class="icon-btn" data-i18n-title="btn.recordAudio"><svg class="icon"><use href="#i-mic"/></svg></button>
      <button id="btn-scroll" data-shortcut="scrollCapture" class="icon-btn" data-i18n-title="btn.scrollCapture" aria-haspopup="dialog"><svg class="icon"><use href="#i-scroll"/></svg></button>
    </div>
    <span class="spacer"></span>
    <button id="btn-settings" class="icon-btn" data-shortcut="settings" data-i18n-title="btn.settings" aria-haspopup="dialog"><svg class="icon"><use href="#i-settings"/></svg></button>
    <label class="ctl lang">
      <svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg>
      <select id="lang-select" data-i18n-title="lang.label"></select>
    </label>
    <a id="btn-github" class="icon-btn" href="https://github.com/mongoemon/zscreen" target="_blank" rel="noopener noreferrer" data-i18n-title="btn.github"><svg class="icon"><use href="#i-github"/></svg></a>
    <!-- hidden until the Ko-fi account is set up; plan: a "hide donate button" option in Settings -->
    <a id="btn-donate" class="icon-btn" href="https://ko-fi.com/mongoemon" target="_blank" rel="noopener noreferrer" data-i18n-title="btn.donate" hidden><svg class="icon"><use href="#i-heart"/></svg></a>
    <span id="zoom-label" class="zoom">100%</span>
    <button id="btn-copy" data-shortcut="copy" class="icon-btn" data-i18n-title="btn.copy"><svg class="icon"><use href="#i-copy"/></svg></button>
    <button id="btn-copy-all" data-shortcut="copyAll" class="icon-btn" data-i18n-title="btn.copyAll"><svg class="icon"><use href="#i-copy-all"/></svg></button>
    <button id="btn-save" data-shortcut="save" class="icon-btn primary" data-i18n-title="btn.save"><svg class="icon"><use href="#i-download"/></svg></button>
  </header>

  <div class="tools" role="toolbar" data-i18n-aria="tools.label">
    <button class="tool icon-btn active" data-tool="select" data-shortcut="toolSelect" data-i18n-title="tool.select"><svg class="icon"><use href="#i-select"/></svg></button>
    <button class="tool icon-btn" data-tool="region" data-shortcut="toolRegion" data-i18n-title="tool.region"><svg class="icon"><use href="#i-region"/></svg></button>
    <button class="tool icon-btn" data-tool="pen" data-shortcut="toolPen" data-i18n-title="tool.pen"><svg class="icon"><use href="#i-pen"/></svg></button>
    <button class="tool icon-btn" data-tool="line" data-shortcut="toolLine" data-i18n-title="tool.line"><svg class="icon"><use href="#i-line"/></svg></button>
    <button class="tool icon-btn" data-tool="arrow" data-shortcut="toolArrow" data-i18n-title="tool.arrow"><svg class="icon"><use href="#i-arrow"/></svg></button>
    <button class="tool icon-btn" data-tool="rect" data-shortcut="toolRect" data-i18n-title="tool.rect"><svg class="icon"><use href="#i-rect"/></svg></button>
    <button class="tool icon-btn" data-tool="ellipse" data-shortcut="toolEllipse" data-i18n-title="tool.ellipse"><svg class="icon"><use href="#i-ellipse"/></svg></button>
    <button class="tool icon-btn" data-tool="highlight" data-shortcut="toolHighlight" data-i18n-title="tool.highlight"><svg class="icon"><use href="#i-highlight"/></svg></button>
    <button class="tool icon-btn" data-tool="text" data-shortcut="toolText" data-i18n-title="tool.text"><svg class="icon"><use href="#i-text"/></svg></button>
    <button class="tool icon-btn" data-tool="step" data-shortcut="toolStep" data-i18n-title="tool.step"><svg class="icon"><use href="#i-step"/></svg></button>
    <button class="tool icon-btn" data-tool="censor" data-shortcut="toolCensor" data-i18n-title="tool.censor"><svg class="icon"><use href="#i-censor"/></svg></button>
    <span class="sep"></span>
    <span class="ctl" data-for="region">
      <button id="btn-region-paste" data-shortcut="regionPaste" class="icon-btn" data-i18n-title="region.paste"><svg class="icon"><use href="#i-image-plus"/></svg></button>
      <button id="btn-region-copy" data-shortcut="copy" class="icon-btn" data-i18n-title="region.copy"><svg class="icon"><use href="#i-copy"/></svg></button>
    </span>
    <span class="ctl" data-for="color">
      <span data-i18n="ctl.color"></span> <input type="color" id="ctl-color" value="#ff3b30" data-i18n-aria="ctl.color" />
      <span id="swatches" class="swatches"></span>
    </span>
    <label class="ctl" data-for="width"><span data-i18n="ctl.width"></span> <input type="range" id="ctl-width" min="1" max="24" value="8" /></label>
    <label class="ctl" data-for="text"><span data-i18n="ctl.fontSize"></span> <input type="range" id="ctl-font" min="12" max="96" value="28" /></label>
    <label class="ctl" data-for="text"><input type="checkbox" id="ctl-bg" /> <span data-i18n="ctl.textBg"></span></label>
    <label class="ctl" data-for="stroke"><input type="checkbox" id="ctl-stroke" checked /> <span data-i18n="ctl.textStroke"></span></label>
    <label class="ctl" data-for="censor"><span data-i18n="ctl.censorMode"></span>
      <select id="ctl-censor">
        <option value="pixel" data-i18n="censor.pixel"></option>
        <option value="blur" data-i18n="censor.blur"></option>
        <option value="solid" data-i18n="censor.solid"></option>
      </select>
    </label>
  </div>

  <div class="workspace">
  <main id="stage">
    <canvas id="canvas"></canvas>
    <textarea id="text-editor" class="text-editor" hidden spellcheck="false" data-i18n-aria="editor.label"></textarea>
    <div id="hint" class="hint">
      <div class="hint-title" data-i18n="hint.title"></div>
      <div><span data-i18n="hint.pressPrefix"></span> <kbd>Ctrl/Cmd</kbd> + <kbd>V</kbd> <span data-i18n="hint.pressSuffix"></span></div>
    </div>
    <div id="dropmask" class="dropmask" data-i18n="drop.hint" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </main>

  <aside id="history-panel" class="history-panel" aria-labelledby="history-title" hidden>
    <div class="history-head">
      <h2 id="history-title" data-i18n="history.title"></h2>
      <button id="history-clear" class="text-btn" data-i18n="history.clear"></button>
      <button id="history-close" class="icon-btn" data-i18n-title="history.close"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>
    <p class="history-hint" data-i18n="history.hint"></p>
    <ul id="history-list" class="history-list"></ul>
    <p id="history-empty" class="history-empty" data-i18n="history.empty" hidden></p>
  </aside>
  </div>

  <div id="changelog" class="changelog" role="dialog" aria-modal="true" aria-labelledby="changelog-title" hidden>
    <div class="changelog-card">
      <div class="changelog-head">
        <h2 id="changelog-title" data-i18n="changelog.title"></h2>
        <button id="changelog-close" class="icon-btn" data-i18n-title="changelog.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div id="changelog-list" class="changelog-list"></div>
      <!-- third-party notices (LGPL asks for a prominent notice; the full texts ship as a file) -->
      <iframe id="licenses-frame" class="licenses-frame" data-i18n-title="licenses.title" hidden></iframe>
      <div class="changelog-foot">
        <span data-i18n="licenses.notice"></span>
        <button id="licenses-toggle" class="text-btn" data-i18n="licenses.show"></button>
      </div>
    </div>
  </div>

  <!-- Screen recording: pick size / frame rate / source, then a small bar while recording.
       The same dialog and bar serve the scrolling screenshot (recorder.js switches the texts). -->
  <div id="record-dialog" class="modal" role="dialog" aria-modal="true" aria-labelledby="record-title" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="record-title" data-i18n="record.title"></h2>
        <button id="record-close" class="icon-btn" data-i18n-title="dialog.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label id="record-size-row" class="field"><span data-i18n="record.size"></span><select id="record-size"></select></label>
          <label id="record-fps-row" class="field"><span data-i18n="record.fps"></span><select id="record-fps"></select></label>
          <label id="record-system-audio-row" class="field check" hidden><input type="checkbox" id="record-system-audio" checked /> <span data-i18n="record.systemAudio"></span></label>
          <label id="record-mic-row" class="field check"><input type="checkbox" id="record-mic" /> <span data-i18n="record.mic"></span></label>
          <label id="record-hide-row" class="field check" hidden><input type="checkbox" id="record-hide" checked /> <span data-i18n="record.hideWindow"></span></label>
        </div>
        <div id="record-sources-wrap" hidden>
          <div class="section-head">
            <h3 data-i18n="record.source"></h3>
            <button id="record-refresh" class="text-btn" data-i18n="record.refresh"></button>
          </div>
          <p id="record-permission" class="note warn" data-i18n="record.permission" hidden></p>
          <div id="record-sources" class="source-grid" role="listbox" data-i18n-aria="record.source"></div>
        </div>
        <p id="record-audio-note" class="note" hidden></p>
        <p id="record-scroll-note" class="note" data-i18n="scroll.note" hidden></p>
        <p id="record-web-note" class="note" data-i18n="record.webNote" hidden></p>
        <p id="record-stop-note" class="note"></p>
      </div>
      <div class="modal-foot">
        <button id="record-start" class="primary" data-i18n="record.start"></button>
      </div>
    </div>
  </div>

  <div id="rec-bar" class="rec-bar" role="status" hidden>
    <span class="rec-dot" aria-hidden="true"></span>
    <span id="rec-label" data-i18n="rec.label"></span>
    <span id="rec-time" class="rec-time">0:00.0</span>
    <button id="rec-stop" class="primary" data-shortcut="record" data-i18n-title="rec.stopTitle"><svg class="icon"><use href="#i-stop"/></svg> <span data-i18n="rec.stop"></span></button>
  </div>

  <!-- Video editor: trim a recording and save it as GIF, a small / low-bitrate video, or as recorded. -->
  <div id="video-editor" class="modal" role="dialog" aria-modal="true" aria-labelledby="video-title" hidden>
    <div id="video-card" class="modal-card wide" tabindex="-1">
      <div class="modal-head">
        <h2 id="video-title" data-i18n="video.title"></h2>
        <span id="video-info" class="muted"></span>
        <button id="video-close" class="icon-btn" data-i18n-title="dialog.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="modal-body">
        <video id="video-preview" class="video-preview" controls playsinline muted preload="auto"></video>
        <fieldset id="video-controls" class="video-controls">
          <div class="trim">
            <label class="field grow"><span data-i18n="video.start"></span><input type="range" id="trim-start" min="0" step="0.1" /><output id="trim-start-label" class="time"></output></label>
            <button id="trim-set-start" class="text-btn" data-shortcut="videoSetStart" data-i18n="video.setStart"></button>
          </div>
          <div class="trim">
            <label class="field grow"><span data-i18n="video.end"></span><input type="range" id="trim-end" min="0" step="0.1" /><output id="trim-end-label" class="time"></output></label>
            <button id="trim-set-end" class="text-btn" data-shortcut="videoSetEnd" data-i18n="video.setEnd"></button>
          </div>
          <div class="form-row">
            <label class="field"><span data-i18n="video.format"></span><select id="video-format"></select></label>
            <label class="field" data-for-format="encode"><span data-i18n="video.size"></span><select id="video-size"></select></label>
            <label class="field" data-for-format="encode"><span data-i18n="video.fps"></span><select id="video-fps"></select></label>
            <label class="field" data-for-format="video"><span data-i18n="video.quality"></span><select id="video-quality"></select></label>
            <label class="field" data-for-format="audio"><span data-i18n="video.audioBitrate"></span><select id="audio-bitrate"></select></label>
            <label id="video-audio-row" class="field check" data-for-format="video"><input type="checkbox" id="video-audio" checked /> <span data-i18n="video.audio"></span></label>
          </div>
          <p id="video-estimate" class="note"></p>
        </fieldset>
        <div id="video-progress-row" class="progress-row" hidden>
          <progress id="video-progress" max="1" value="0"></progress>
          <span id="video-progress-label" class="muted"></span>
        </div>
      </div>
      <div class="modal-foot">
        <button id="video-frame" class="text-btn" data-shortcut="videoAddFrame" data-i18n="video.addFrame"></button>
        <span class="spacer"></span>
        <button id="video-cancel" data-i18n="video.cancel" hidden></button>
        <button id="video-save" class="primary" data-shortcut="videoSave" data-i18n-title="video.saveTitle"><svg class="icon"><use href="#i-download"/></svg> <span data-i18n="video.save"></span></button>
      </div>
    </div>
  </div>

  <!-- New blank page: a preset (paper / screen / social) or any width x height, added to the canvas as an image. -->
  <div id="blank-dialog" class="modal" role="dialog" aria-modal="true" aria-labelledby="blank-title" hidden>
    <form id="blank-form" class="modal-card" novalidate>
      <div class="modal-head">
        <h2 id="blank-title" data-i18n="blank.title"></h2>
        <button type="button" id="blank-close" class="icon-btn" data-i18n-title="dialog.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label class="field"><span data-i18n="blank.preset"></span><select id="blank-preset"></select></label>
          <label id="blank-dpi-row" class="field"><span data-i18n="blank.dpi"></span><select id="blank-dpi"></select></label>
        </div>
        <div class="form-row">
          <label class="field"><span data-i18n="blank.width"></span><input type="number" id="blank-width" min="16" max="10000" step="1" required /> px</label>
          <button type="button" id="blank-swap" class="icon-btn" data-i18n-title="blank.swap"><svg class="icon"><use href="#i-rotate"/></svg></button>
          <label class="field"><span data-i18n="blank.height"></span><input type="number" id="blank-height" min="16" max="10000" step="1" required /> px</label>
        </div>
        <div class="form-row">
          <label class="field"><span data-i18n="blank.background"></span><input type="color" id="blank-color" value="#ffffff" data-i18n-aria="blank.background" /></label>
          <label class="field check"><input type="checkbox" id="blank-transparent" /> <span data-i18n="blank.transparent"></span></label>
        </div>
        <p id="blank-info" class="note"></p>
      </div>
      <div class="modal-foot">
        <button type="submit" class="primary" data-i18n-title="blank.createTitle"><svg class="icon"><use href="#i-file-plus"/></svg> <span data-i18n="blank.create"></span></button>
      </div>
    </form>
  </div>

  <!-- Settings: keyboard shortcuts (rows are built by shortcut-settings.js). -->
  <div id="settings-dialog" class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
    <div class="modal-card wide">
      <div class="modal-head">
        <h2 id="settings-title" data-i18n="settings.title"></h2>
        <button id="settings-close" class="icon-btn" data-i18n-title="dialog.close"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="modal-body">
        <h3 data-i18n="settings.shortcuts"></h3>
        <p class="note" data-i18n="settings.hint"></p>
        <div id="shortcut-list" class="shortcut-list"></div>
        <h3 class="sc-fixed-title" data-i18n="settings.fixed"></h3>
        <dl id="fixed-shortcuts" class="fixed-list"></dl>
      </div>
      <div class="modal-foot">
        <button id="shortcuts-reset-all" data-i18n="settings.resetAll"></button>
        <span class="spacer"></span>
        <button id="settings-done" class="primary" data-i18n="dialog.close"></button>
      </div>
    </div>
  </div>

  <input id="file-input" type="file" accept="image/*,video/*" multiple hidden />
  <script src="version.js"></script>
  <script src="i18n.js"></script>
  <script src="keys.js"></script>
  <script src="shortcuts.js"></script>
  <script src="video-options.js"></script>
  <script src="blank-page.js"></script>
  <script src="gif-encoder.js"></script>
  <script src="webm-duration.js"></script>
  <script src="scene.js"></script>
  <script src="draw.js"></script>
  <script src="app.js"></script>
  <script src="viewport.js"></script>
  <script src="text-editor.js"></script>
  <script src="tools.js"></script>
  <script src="selection.js"></script>
  <script src="annotate.js"></script>
  <script src="scene-actions.js"></script>
  <script src="export.js"></script>
  <script src="region.js"></script>
  <script src="blank-dialog.js"></script>
  <script src="shortcut-settings.js"></script>
  <script src="mediabunny.min.js"></script>
  <script src="mediabunny-mp3-encoder.min.js"></script>
  <script src="video-editor.js"></script>
  <script src="scroll-stitch.js"></script>
  <script src="scroll-capture.js"></script>
  <script src="recorder.js"></script>
  <script src="pointer.js"></script>
  <script src="input.js"></script>
  <script src="clipboard-history.js"></script>
  <script src="web-history.js"></script>
  <script src="history-panel.js"></script>

</body>
